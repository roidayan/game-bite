  <!-- Audio Synth & Game Engine -->
  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggleBtn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12); // G5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'streak') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

          options: ["40 סמ\"ר", "28 סמ\"ר", "20 סמ\"ר", "80 סמ\"ר"],

        {
          prompt: "חשבו את שטח המשולש ישר-הזווית שבשרטוט:",
          diagram: `<svg viewBox="0 0 220 125" class="w-full max-w-[220px] h-auto max-h-[115px]">

          </svg>`,
          options: ["12 סמ\"ר", "24 סמ\"ר", "10 סמ\"ר", "20 סמ\"ר"],
          answer: "12 סמ\"ר",
          explanation: "במשולש ישר-זווית הניצבים משמשים כבסיס וגובה: (6 × 4) ÷ 2 = 24 ÷ 2 = 12 סמ\"ר."
        },
        {
          prompt: "לפניכם קובייה שאורך צלעה 4 ס\"מ. מהו נפח הקובייה?",
          diagram: `<svg viewBox="0 0 200 125" class="w-full max-w-[200px] h-auto max-h-[115px]">
            <polygon points="45,45 80,20 145,20 110,45" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="2"/>
            <polygon points="45,45 110,45 110,95 45,95" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="2"/>
            <polygon points="110,45 145,20 145,70 110,95" fill="rgba(147, 51, 234, 0.35)" stroke="#9333ea" stroke-width="2"/>
            <text x="77" y="112" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">צלע = 4 ס"מ</text>
          </svg>`,
          options: ["64 סמ\"ק", "16 סמ\"ק", "48 סמ\"ק", "32 סמ\"ק"],
          answer: "64 סמ\"ק",
          explanation: "נפח קובייה שווה לצלע בחזקת 3: 4 × 4 × 4 = 64 סמ\"ק."
        }
      ]
    };

    let currentCategory = 'all';
    let currentQuestion = null;
    let score = 0;
    let streak = 0;
    let timerInterval = null;
    let timeLeft = 60;
    let timerActive = false;

    const topicTitles = {
      percent: 'אחוזים וחישובים',
      negatives: 'מספרים מכוונים (שליליים)',
      fractions: 'שברים פשוטים ועשרוניים',
      ratios: 'יחס, פרופורציה וקנה מידה',
      geometry: 'גאומטריה, שטחים ונפחים'
    };

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.classList.replace('bg-slate-800', 'bg-emerald-600');
          btn.classList.replace('text-slate-300', 'text-white');
        } else {
          btn.classList.replace('bg-emerald-600', 'bg-slate-800');
          btn.classList.replace('text-white', 'text-slate-300');
        }
      });
      nextQuestion();
    }

    function getRandomQuestion() {
      let pool = [];
      if (currentCategory === 'all') {
        Object.keys(questionBank).forEach(k => {
          questionBank[k].forEach(q => pool.push({ ...q, category: k }));
        });
      } else {
        (questionBank[currentCategory] || []).forEach(q => {
          pool.push({ ...q, category: currentCategory });
        });
      }
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function nextQuestion(isSkip = false) {
      const q = getRandomQuestion();
      if (!q) return;
      currentQuestion = q;

      document.getElementById('topicName').innerText = topicTitles[q.category] || 'תרגיל מתקדם';
      document.getElementById('questionPrompt').innerText = q.prompt;

      const questionDisplay = document.getElementById('questionDisplay');
      const diagramDisplay = document.getElementById('diagramDisplay');

      if (q.diagram) {
        questionDisplay.classList.add('hidden');
        diagramDisplay.classList.remove('hidden');
        diagramDisplay.innerHTML = q.diagram;
      } else {
        diagramDisplay.classList.add('hidden');
        questionDisplay.classList.remove('hidden');
        const eqText = q.equation ? q.equation.replace(/\\times/g, '×').replace(/\\div/g, '÷').replace(/\\frac{(\d+)}{(\d+)}/g, '$1/$2').replace(/\\text{.*?}/g, '') : '';
        questionDisplay.innerText = eqText;
      }

      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.classList.add('hidden');
      feedbackBox.className = "mt-4 w-full p-3 rounded-2xl text-xs sm:text-sm font-semibold hidden text-center transition";

      // Render Options (shuffled)
      const optionsContainer = document.getElementById('optionsGrid');
      optionsContainer.innerHTML = '';

      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "option-btn p-3.5 sm:p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-800 active:scale-95 border-2 border-slate-700/80 hover:border-emerald-500 text-white font-bold text-base sm:text-lg math-font shadow-lg flex items-center justify-center transition";
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selected, buttonElem) {
      const isCorrect = selected === currentQuestion.answer;
      const feedbackBox = document.getElementById('feedbackBox');
      const allButtons = document.querySelectorAll('.option-btn');

      allButtons.forEach(btn => btn.disabled = true);

      if (isCorrect) {
        buttonElem.classList.replace('border-slate-700/80', 'border-emerald-400');
        buttonElem.classList.add('bg-emerald-600/50', 'text-emerald-200');
        score += 10;
        streak += 1;
        playSound(streak >= 3 ? 'streak' : 'correct');

        if (streak % 5 === 0) {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        }

        feedbackBox.innerHTML = `<span>כל הכבוד! תשובה נכונה ✓</span> <div class="text-[11px] font-normal text-emerald-200 mt-1">${currentQuestion.explanation}</div>`;
        feedbackBox.classList.remove('hidden');
        feedbackBox.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border', 'border-emerald-500/40');

        updateScoreBoard();
        setTimeout(() => nextQuestion(), 1400);

      } else {
        buttonElem.classList.replace('border-slate-700/80', 'border-rose-500');
        buttonElem.classList.add('bg-rose-950/60', 'text-rose-200');
        document.getElementById('questionCard').classList.add('shake');
        setTimeout(() => document.getElementById('questionCard').classList.remove('shake'), 450);

        streak = 0;
        playSound('wrong');

        // Highlight correct answer
        allButtons.forEach(btn => {
          if (btn.innerText === currentQuestion.answer) {
            btn.classList.replace('border-slate-700/80', 'border-emerald-400');
            btn.classList.add('bg-emerald-950/70', 'text-emerald-300');
          }
        });

        feedbackBox.innerHTML = `<span>לא מדויק. התשובה היא: <strong>${currentQuestion.answer}</strong></span> <div class="text-[11px] font-normal text-rose-200 mt-1">${currentQuestion.explanation}</div>`;
        feedbackBox.classList.remove('hidden');
        feedbackBox.classList.add('bg-rose-950/80', 'text-rose-300', 'border', 'border-rose-500/40');

        updateScoreBoard();
        setTimeout(() => nextQuestion(), 2400);
      }
    }

    function updateScoreBoard() {
      document.getElementById('scoreCount').innerText = score;
      document.getElementById('streakCount').innerText = streak;
    }

    function toggleTimerMode() {
      timerActive = !timerActive;
      const display = document.getElementById('timerDisplay');
      if (timerActive) {
        display.classList.remove('hidden');
        timeLeft = 60;
        display.innerText = timeLeft;
        timerInterval = setInterval(() => {
          timeLeft--;
          display.innerText = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerActive = false;
            display.classList.add('hidden');
            alert(`הזמן נגמר! צברת ${score} נקודות ב-60 שניות! 🏆`);
          }
        }, 1000);
      } else {
        clearInterval(timerInterval);
        display.classList.add('hidden');
      }
    }

    // Scratchpad canvas logic
    let isDrawing = false;
    let canvas, ctx;

    function initCanvas() {
      canvas = document.getElementById('scratchCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startDraw({ clientX: touch.clientX, clientY: touch.clientY });
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        draw({ clientX: touch.clientX, clientY: touch.clientY });
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchend', endDraw);
    }

    function resizeCanvas() {
      if (!canvas) return;
      const newWidth = Math.floor(canvas.parentElement.clientWidth);
      const newHeight = Math.floor(canvas.parentElement.clientHeight);

      if (newWidth <= 0 || newHeight <= 0) return;

      if (canvas.width === newWidth && canvas.height === newHeight) {
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#34d399';
        return;
      }

      let temp = null;
      if (canvas.width > 0 && canvas.height > 0) {
        temp = document.createElement('canvas');
        temp.width = canvas.width;
        temp.height = canvas.height;
        temp.getContext('2d').drawImage(canvas, 0, 0);
      }

      canvas.width = newWidth;
      canvas.height = newHeight;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#34d399';

      if (temp) {
        ctx.drawImage(temp, 0, 0);
      }
    }

    function startDraw(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    }

    function endDraw() {
      isDrawing = false;
    }

    function clearScratchpad() {
      if (ctx && canvas) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function toggleScratchpad() {
      const modal = document.getElementById('scratchModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        modal.classList.remove('hidden');
        if (!canvas) initCanvas();
        else resizeCanvas();
      } else {
        modal.classList.add('hidden');
      }
    }

    // Initialize first question
    window.addEventListener('DOMContentLoaded', () => {
      nextQuestion();
    });
  </script>
